services:
  tiktok:
    build: .
    container_name: tiktok-satisfying
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data   # vidéos, historique et jeton TikTok (à conserver !)
    # Évite qu'un rendu monopolise tout le VPS.
    cpus: 1.5
    mem_limit: 1g

  # Optionnel : mini-site (icône, conditions, confidentialité) demandé par TikTok.
  # Lancer avec :  docker compose --profile site up -d
  site:
    image: caddy:2.8
    profiles: [site]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?mets DOMAIN=ton-domaine.fr dans .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data

  # Variante : site en HTTP simple sur le port 8082, derrière un reverse proxy déjà en place
  # (nginx, Traefik, Caddy...) qui gère le HTTPS. Lancer avec :  docker compose --profile site-8082 up -d
  site-8082:
    image: caddy:2.8
    profiles: [site-8082]
    restart: unless-stopped
    command: caddy file-server --root /srv --listen :8082
    ports:
      - "8082:8082"
    volumes:
      - ./site:/srv:ro

volumes:
  caddy_data:
