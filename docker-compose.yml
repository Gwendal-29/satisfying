services:
  tiktok:
    build: .
    container_name: tiktok-satisfying
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data   # vidéos, historique et jeton TikTok (à conserver !)
    # Évite qu'un rendu monopolise tout le VPS.
    cpus: 1.5
    mem_limit: 1g

  # Optionnel : mini-site (icône, conditions, confidentialité) demandé par TikTok.
  # Lancer avec :  docker compose --profile site up -d
  site:
    image: caddy:2.8
    profiles: [site]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?mets DOMAIN=ton-domaine.fr dans .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data

  # Variante : site en HTTPS sur le port 8082 (quand 80/443 sont déjà pris sur le VPS).
  # Certificat obtenu via DuckDNS. Lancer avec :  docker compose --profile site-8082 up -d --build site-8082
  site-8082:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    profiles: [site-8082]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    ports:
      - "8082:8082"
    volumes:
      - ./Caddyfile.8082:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data

volumes:
  caddy_data:
